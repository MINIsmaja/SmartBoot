; SmartBoot - friendly firmware launcher for the M5Stack Cardputer ADV
; Build:      pio run
; Flash:      pio run -t upload
; Serial:     pio device monitor
; Screenshot: python3 tools/screenshot.py out.png

[env:cardputer-adv]
; pioarduino = maintained fork with Arduino-ESP32 3.x (needed for Cardputer ADV support)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino
board_build.partitions = custom_8mb.csv
board_upload.flash_size = 8MB
monitor_speed = 115200
upload_speed = 1500000
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    m5stack/M5Cardputer@^1.1.1
    bblanchon/ArduinoJson@^7.4.3

; Public builds: same firmware without the serial dev console. tools/release.sh uses this.
[env:release]
extends = env:cardputer-adv
build_flags =
    ${env:cardputer-adv.build_flags}
    -DSMARTBOOT_RELEASE

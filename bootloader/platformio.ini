; SmartBoot's bootloader: the stock ESP-IDF 5.5.5 bootloader plus one rule.
;   power-on reset  -> SmartBoot (factory partition)
;   any other reset -> whatever otadata selects (the launched app)
; Our Arduino core is built on the same IDF version (framework-arduinoespressif32-libs 5.5.5).
;
; Build:  pio run          -> .pio/build/bootloader/bootloader.bin  (flash at 0x0)
; The app in src/ is only a test app that checks the rule on the device; see src/main.c.

[env:bootloader]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = m5stack-stamps3
framework = espidf
board_build.partitions = ../custom_8mb.csv
board_build.flash_mode = dio
board_upload.flash_size = 8MB
monitor_speed = 115200
